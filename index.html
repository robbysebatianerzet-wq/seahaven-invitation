<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seahaven Villas by Kamuela | Opening</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- OPENING COVER -->
    <section id="opening" class="opening">
        <div class="opening-content">
            <div class="brand">
                <!-- Gunakan logo gambar, teks brand di-comment -->
                <img src="assets/logo-seahaven.png" alt="Seahaven Villas Logo" class="brand-logo">
                <!-- <div class="brand-text">
                    SEAHAVEN VILLAS
                    <span>BY KAMUELA</span>
                </div> -->
            </div>

            <div class="invitation-text">
                <p class="subtitle">BLESSING CEREMONY</p>
                <p class="to-label">Dear</p>
                <h1 id="guest-name" class="guest-name">Valued Guest</h1>
            </div>

            <button id="open-btn" class="open-btn">Open Invitation</button>
        </div>
    </section>

    <!-- MAIN INVITATION CONTENT -->
    <main id="main-content" class="main-content hidden">
        <section class="card-section">
            <img src="assets/Opening%20Invitation%20-%20Seahaven%201.jpg" alt="Seahaven Villas Blessing Ceremony Invitation">
        </section>

        <section class="card-section">
            <img src="assets/Opening%20Invitation%20-%20Seahaven%202.jpg" alt="Seahaven Villas Blessing Ceremony Details">
        </section>

        <section class="action-section">
            <a href="https://maps.app.goo.gl/2dp2iQXgr6QQ9kHh7" target="_blank" rel="noopener noreferrer" class="btn btn-maps">
                📍 Open Google Maps
            </a>
            <a href="https://forms.gle/your-google-form-link" target="_blank" rel="noopener noreferrer" class="btn btn-rsvp">
                📝 Confirm Attendance
            </a>
        </section>

        <footer class="footer">
            <p>Seahaven Villas by Kamuela</p>
            <p>Thank you for being part of our special occasion.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
