<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessing Ceremony - Seahaven Villas by Kamuela</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BRANDING HEADER -->
    <section class="brand-header">
        <div class="brand-container">
            <div class="brand-logo">
                SEAHAVEN VILLAS
                <span>BY KAMUELA</span>
            </div>
            <div class="guest-box">
                <p class="event-title">BLESSING CEREMONY</p>
                <p class="salutation">Dear</p>
                <h1 id="guest-name">Our Distinguished Guest</h1>
            </div>
        </div>
    </section>

    <!-- CONTENT / IMAGES -->
    <main class="invitation-body">
        
        <!-- SLIDE / GAMBAR 1 -->
        <section class="card-section">
            <img src="assets/Opening%20Invitation%20-%20Seahaven%201.jpg" alt="Seahaven Villas Blessing Ceremony Invitation">
        </section>

        <!-- SLIDE / GAMBAR 2 -->
        <section class="card-section">
            <img src="assets/Opening%20Invitation%20-%20Seahaven%202.jpg" alt="Seahaven Villas Blessing Ceremony Details">
        </section>

        <!-- ACTION BUTTONS -->
        <section class="action-section">
            <a href="https://maps.app.goo.gl/2dp2iQXgr6QQ9kHh7" target="_blank" rel="noopener noreferrer" class="btn btn-maps">
                <span>📍</span>
                <span>Open Google Maps</span>
            </a>
            <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-rsvp">
                <span>📝</span>
                <span>Confirm Attendance</span>
            </a>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-logo">SEAHAVEN VILLAS</div>
            <div class="footer-sub">BY KAMUELA</div>
            <p>Thank you for being part of our special occasion.</p>
        </footer>

    </main>

    <script>
        // Logika membaca nama tamu dari URL (?guest=Nama atau ?to=Nama)
        const urlParams = new URLSearchParams(window.location.search);
        const guestName = urlParams.get('guest') || urlParams.get('to');
        if (guestName) {
            document.getElementById('guest-name').textContent = decodeURIComponent(guestName);
        }
    </script>
</body>
</html>
