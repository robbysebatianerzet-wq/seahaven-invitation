<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blessing Ceremony - Seahaven Villas by Kamuela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTAINER UTAMA UNDANGAN -->
  <div class="invitation-container">
    
    <!-- TAMPILAN NAMA TAMU (URL Parameter ?to=Nama+Tamu) -->
    <div id="guest-overlay" class="guest-name-box">
      <p class="guest-label">Dear / Kepada:</p>
      <h2 id="guest-name" class="guest-title">Valued Guest</h2>
    </div>

    <!-- SLIDER / CAROUSEL -->
    <div class="slider-wrapper">
      
      <!-- SLIDE 1 -->
      <div class="slide active">
        <img 
          src="assets/Opening Invitation - Seahaven 1.jpg" 
          alt="Seahaven Villas Blessing Ceremony Invitation" 
          class="invitation-image"
        >
      </div>

      <!-- SLIDE 2 -->
      <div class="slide">
        <img 
          src="assets/Opening Invitation - Seahaven 2.jpg" 
          alt="Seahaven Villas Blessing Ceremony Details" 
          class="invitation-image"
        >
      </div>

    </div>

    <!-- TOMBOL NAVIGASI SLIDE -->
    <div class="navigation-controls">
      <button id="prevBtn" onclick="changeSlide(-1)">&#10094; Prev</button>
      <span id="slide-indicator">1 / 2</span>
      <button id="nextBtn" onclick="changeSlide(1)">Next &#10095;</button>
    </div>

    <!-- TOMBOL ACTION (LOCATION & RSVP) -->
    <div class="action-buttons">
      <a href="https://maps.app.goo.gl/2dp2iQXgr6QQ9kHh7" target="_blank" class="btn btn-maps">
        📍 View Location (Google Maps)
      </a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
