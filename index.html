<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OPENING INVITATION | Seahaven villas by Kamuela</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- OPENING COVER -->
    <section id="opening" class="opening">
        <div class="opening-content">

            <div class="brand">
                SEAHAVEN VILLAS
                <span>BY KAMUELA</span>
            </div>

            <div class="ceremony">
                <p class="eyebrow">THE OPENING INVITATION</p>
                <p class="dear">Dear</p>

                <h1 id="guestName">Our Distinguished Guest</h1>

                <button id="openInvitation" class="open-btn">
                    OPEN INVITATION
                </button>
            </div>

        </div>
    </section>


    <!-- MAIN INVITATION -->
    <main id="invitation" class="invitation">

        <!-- Invitation Front -->
       <section class="invitation-page reveal">
            <img
                src="assets/Opening Invitation - Seahaven-02.jpg"
                alt="Seahaven Villas Blessing Ceremony Invitation"
                class="invitation-image"
            >
        </section>

        <!-- ACTION BUTTONS -->
        <section class="actions reveal">

            <a
                href="https://maps.app.goo.gl/2dp2iQXgr6QQ9kHh7"
                target="_blank"
                rel="noopener noreferrer"
                class="action-btn maps-btn"
            >
                <span class="icon">📍</span>
                <span>Open Google Maps</span>
            </a>

            <a
                id="rsvpButton"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="action-btn rsvp-btn"
            >
                <span class="icon">📝</span>
                <span>Confirm Attendance</span>
            </a>

        </section>

        <!-- FOOTER -->
        <footer class="footer reveal">
            <div class="footer-brand">SEAHAVEN VILLAS</div>
            <div>BY KAMUELA</div>
            <p>Thank you for being part of our special occasion.</p>
        </footer>

    </main>


    <script>

        // GET GUEST NAME
        const params = new URLSearchParams(window.location.search);
        const guest = params.get("guest");
        const guestName = document.getElementById("guestName");

        let guestText = "Our Distinguished Guest";

        if (guest) {
            guestText = decodeURIComponent(guest);
        }

        guestName.textContent = guestText;


        // RSVP GOOGLE FORM
        const rsvpButton = document.getElementById("rsvpButton");

        const formURL =
            "https://docs.google.com/forms/d/e/1FAIpQLSfTNwyctNnz9KR4f4WHtUo234dq0oVlWAY77o9CVXWRkidDxg/viewform?usp=pp_url";

        if (guest) {
            rsvpButton.href =
                formURL +
                "&entry.2095795296=" +
                encodeURIComponent(guest);
        } else {
            rsvpButton.href = formURL;
        }


        // OPEN INVITATION TRANSITION
        const openButton =
            document.getElementById("openInvitation");

        const opening =
            document.getElementById("opening");

        const invitation =
            document.getElementById("invitation");

        openButton.addEventListener("click", function () {

            opening.classList.add("closing");

            setTimeout(function () {

                invitation.classList.add("show");

                window.scrollTo({
                    top: 0,
                    behavior: "instant"
                });

            }, 550);

        });


        // SCROLL REVEAL
        const revealElements =
            document.querySelectorAll(".reveal");

        const observer =
            new IntersectionObserver(
                function(entries) {

                    entries.forEach(function(entry) {

                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                        }

                    });

                },
                {
                    threshold: 0.12
                }
            );

        revealElements.forEach(function(element) {
            observer.observe(element);
        });

    </script>

</body>
</html>
